apiVersion: apps/v1
kind: Deployment
metadata:
  name: edugov-frontend
  labels:
    app: edugov-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edugov-frontend
  template:
    metadata:
      labels:
        app: edugov-frontend
    spec:
      containers:
        - name: edugov-frontend
          image: edugov-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: VITE_API_URL
              value: "http://65.2.182.134:5001/api"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 5
