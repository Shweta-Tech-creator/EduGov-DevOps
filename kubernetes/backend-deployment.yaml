apiVersion: apps/v1
kind: Deployment
metadata:
  name: edugov-backend
  labels:
    app: edugov-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edugov-backend
  template:
    metadata:
      labels:
        app: edugov-backend
    spec:
      containers:
        - name: edugov-backend
          image: edugov-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/edugov_db"
            - name: JWT_SECRET
              value: "edugov_super_secret_jwt_key_2026"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
