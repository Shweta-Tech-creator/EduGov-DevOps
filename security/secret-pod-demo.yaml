# secret-pod-demo.yaml - Example configuration demonstrating Vault Sidecar Injector
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edugov-backend-vault
  labels:
    app: edugov-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edugov-backend
  template:
    metadata:
      labels:
        app: edugov-backend
      annotations:
        # Enable the Vault Agent Injector
        vault.hashicorp.com/agent-inject: "true"
        
        # Reference the role we will configure in Vault
        vault.hashicorp.com/role: "edugov-read-role"
        
        # Specify the secret path in Vault
        vault.hashicorp.com/agent-inject-secret-db-creds: "secret/data/edugov"
        
        # Define the template for rendering the secret as a file (.env style)
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "secret/data/edugov" -}}
          MONGO_URI="{{ .Data.data.MONGO_URI }}"
          JWT_SECRET="{{ .Data.data.JWT_SECRET }}"
          {{- end -}}
    spec:
      serviceAccountName: edugov-vault-sa # SA authorized to talk to Vault
      containers:
        - name: edugov-backend
          image: shweta1616/edugov-backend:latest
          ports:
            - containerPort: 5000
          # We can load the secrets in the app by sourcing /vault/secrets/db-creds
          command: ["/bin/sh", "-c", ". /vault/secrets/db-creds && npm start"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
